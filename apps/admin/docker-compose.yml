services:
  admin:
    build:
      context: ../..
      dockerfile: apps/admin/Dockerfile
    container_name: kunk-admin
    ports:
      - "4256:4256"
    env_file:
      - .env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      WATCHPACK_POLLING: "true"
      VITE_API_PROXY_TARGET: "http://host.docker.internal:4250"
    volumes:
      - ./src:/app/apps/admin/src
      - ./index.html:/app/apps/admin/index.html
      - ./vite.config.js:/app/apps/admin/vite.config.js
      - ./package.json:/app/apps/admin/package.json
      - ../../packages:/app/packages
      - admin_node_modules:/app/node_modules
      - admin_app_node_modules:/app/apps/admin/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  admin_node_modules:
  admin_app_node_modules:
