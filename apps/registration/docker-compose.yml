services:
  registration:
    build:
      context: ../..
      dockerfile: apps/registration/Dockerfile
    container_name: kunk-registration
    ports:
      - "4255:4255"
    env_file:
      - .env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      WATCHPACK_POLLING: "true"
      VITE_API_PROXY_TARGET: "http://host.docker.internal:4250"
    volumes:
      - ./src:/app/apps/registration/src
      - ./index.html:/app/apps/registration/index.html
      - ./vite.config.js:/app/apps/registration/vite.config.js
      - ./package.json:/app/apps/registration/package.json
      - ../../packages:/app/packages
      - registration_node_modules:/app/node_modules
      - registration_app_node_modules:/app/apps/registration/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  registration_node_modules:
  registration_app_node_modules:
